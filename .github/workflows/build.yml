name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Logic checks
        run: ./build.sh check

      - name: Build app
        run: ./build.sh build

      - name: Verify Finder service and localizations
        run: |
          PLIST=.build/Build/Products/Release/InvoiceQR.app/Contents/Info.plist
          RESOURCES=.build/Build/Products/Release/InvoiceQR.app/Contents/Resources
          plutil -lint "$PLIST"
          plutil -extract NSServices.0.NSMessage raw -o - "$PLIST" | grep -qx createPaymentQR
          plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw -o - "$PLIST" | grep -qx com.adobe.pdf
          # A missing localization is invisible at runtime, so fail the build over it.
          for LANGUAGE in en de; do
            STRINGS="$RESOURCES/$LANGUAGE.lproj/Localizable.strings"
            if [ ! -f "$STRINGS" ]; then
              echo "::error::$LANGUAGE.lproj/Localizable.strings is missing from the bundle."
              ls -R "$RESOURCES"
              exit 1
            fi
            COUNT=$(plutil -convert json -o - "$STRINGS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
            echo "$LANGUAGE: $COUNT strings"
            test "$COUNT" -gt 90
          done
          echo "Service, document types and both localizations are in the bundle."

      - name: Package app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            .build/Build/Products/Release/InvoiceQR.app \
            InvoiceQR.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceQR-app
          path: InvoiceQR.app.zip
          if-no-files-found: error

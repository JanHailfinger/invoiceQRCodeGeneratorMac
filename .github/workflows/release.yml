name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Without certificate secrets the release still ships, ad-hoc signed,
      # so a tag never fails on a missing key.
      - name: Check signing credentials
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$TEAM" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID certificate present."
            if [ -n "$ASC_KEY" ] || [ -n "$APP_PASSWORD" ]; then
              echo "notarize=true" >> "$GITHUB_OUTPUT"
              echo "Notarization credentials present."
            else
              echo "notarize=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Signed but not notarized - no ASC_KEY_P8 or APPLE_APP_PASSWORD."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets - release will be ad-hoc signed."
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Logic checks
        run: ./build.sh check

      - name: Import certificate into a temporary keychain
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Build signed, notarize, package
        if: steps.creds.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          fi
          ./build.sh dist
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: Build ad-hoc and package
        if: steps.creds.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh package

      - name: Verify bundle and installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP=.build/Build/Products/Release/InvoiceQR.app
          plutil -lint "$APP/Contents/Info.plist"
          plutil -extract NSServices.0.NSMessage raw -o - "$APP/Contents/Info.plist" | grep -qx createPaymentQR
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test -d "$APP/Contents/Resources/en.lproj"
          test -d "$APP/Contents/Resources/de.lproj"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|flags"
          test -f "InvoiceQR-$VERSION.dmg"
          test -f "InvoiceQR-$VERSION.pkg"
          shasum -a 256 "InvoiceQR-$VERSION.dmg" "InvoiceQR-$VERSION.pkg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZED: ${{ steps.creds.outputs.notarize }}
        run: |
          {
            echo "macOS app that reads invoices with OpenAI and shows the payment details as an"
            echo "EPC069-12 QR code (GiroCode). English and German UI, follows the system language."
            echo
            echo "## Install"
            echo
            echo "Two options, same app:"
            echo
            echo "- **\`InvoiceQR-$VERSION.dmg\`** - open it, drag the app to Applications."
            echo "- **\`InvoiceQR-$VERSION.pkg\`** - double-click, the installer puts the app in"
            echo "  \`/Applications\`. Pick this one if you want the Finder service to work right away."
            echo
            if [ "$NOTARIZED" = "true" ]; then
              echo "Signed with Developer ID and notarized by Apple - no Gatekeeper warning."
            else
              echo "This build is **not notarized**. On first launch, right-click the app and choose"
              echo "\"Open\", then confirm. If macOS claims the app is damaged:"
              echo
              echo "       xattr -dr com.apple.quarantine /Applications/InvoiceQR.app"
            fi
            echo
            echo "Then press \`⌘,\` and enter your OpenAI API key. It goes into the keychain."
            echo
            echo "## Use"
            echo
            echo "Right-click an invoice in Finder, then Services, then \"Create Payment QR Code\"."
            echo "Or Open With, or drag and drop onto the window, or press \`⌘O\`."
            echo
            echo "If the Services entry is missing, run \`/System/Library/CoreServices/pbs -flush\`."
            echo
            echo "## Before you send the transfer"
            echo
            echo "Check payee, IBAN and amount against the invoice. The model can be wrong,"
            echo "especially when the document contains more than one IBAN."
          } > notes.md

          gh release create "v$VERSION" \
            --title "InvoiceQR $VERSION" \
            --notes-file notes.md \
            "InvoiceQR-$VERSION.dmg" \
            "InvoiceQR-$VERSION.pkg" \
            SHA256SUMS.txt

      - name: Remove temporary keychain
        if: always() && steps.creds.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

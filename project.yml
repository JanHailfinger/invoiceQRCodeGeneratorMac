name: InvoiceQR
options:
  bundleIdPrefix: de.rvm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: InvoiceQR
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    INFOPLIST_FILE: Resources/Info.plist
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    DEAD_CODE_STRIPPING: "YES"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  InvoiceQR:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Referencing the folder lets xcodegen build a variant group from the
      # .lproj directories, which is what fills knownRegions.
      - path: Resources
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rvm.InvoiceQR
    dependencies: []

schemes:
  InvoiceQR:
    build:
      targets:
        InvoiceQR: all
    run:
      config: Debug
